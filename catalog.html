<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>세움 디자인하우징 | 온라인 카탈로그</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a0b3d;
      color: #111;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f4f1fa;
      padding-bottom: 100px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: linear-gradient(135deg, #2a1466, #4b1c7a);
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .topbar .back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
    .topbar .back:active { transform: scale(0.97); }

    .topbar .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
    }

    .intro {
      padding: 18px 18px 8px;
      text-align: center;
    }
    .intro h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 900;
      color: #2c0a4a;
      letter-spacing: -0.3px;
    }
    .intro p {
      margin: 0;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .pages {
      padding: 14px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .page {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(34, 10, 70, 0.08);
      border: 1px solid #ecdcf2;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
      background: #fafafa;
    }

    .page-label {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #6a1b8c;
      border-top: 1px solid #f1e6f8;
      background: #fcf9ff;
      letter-spacing: -0.2px;
    }

    .img-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      padding: 30px 16px;
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
      background:
        repeating-linear-gradient(45deg, #f7f2fc, #f7f2fc 10px, #efe6f7 10px, #efe6f7 20px);
    }
    .img-fallback strong {
      display: block;
      color: #6a1b8c;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .cta {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      width: calc(100% - 24px);
      max-width: 456px;
      z-index: 20;
    }
    .cta a {
      display: block;
      text-align: center;
      padding: 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff4d8d 0%, #b14dff 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(177, 77, 255, 0.45);
      letter-spacing: -0.2px;
    }
    .cta a:active { transform: scale(0.99); }

    /* Lightbox (탭하면 확대) */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: pinch-zoom;
    }
    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 0;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .footer-info {
      margin: 18px 16px 0;
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #ecdcf2;
      font-size: 12.5px;
      color: #444;
      line-height: 1.7;
    }
    .footer-info .brand {
      font-weight: 900;
      color: #2c0a4a;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .footer-info .row { display: flex; gap: 8px; }
    .footer-info .row .k { width: 64px; color: #888; flex-shrink: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a href="index.html" class="back">‹ 메뉴</a>
      <div class="title">온라인 카탈로그</div>
    </div>

    <div class="intro">
      <h1>(주)세움 디자인하우징</h1>
      <p>이미지를 탭하면 크게 볼 수 있습니다.</p>
    </div>

    <div class="pages" id="pages">
      <!-- pages injected by JS -->
    </div>

    <div class="footer-info">
      <div class="brand">(주)세움 디자인하우징</div>
      <div class="row"><span class="k">대표번호</span><span>1899-1828</span></div>
      <div class="row"><span class="k">본사</span><span>경기도 김포시 통진읍 김포대로 2295</span></div>
    </div>
  </main>

  <div class="cta">
    <a href="apply.html">🎁 박람회 특별혜택 신청하기</a>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-label="이미지 크게 보기">
    <button class="lightbox-close" id="lbClose" aria-label="닫기">✕</button>
    <img id="lbImg" alt="" />
  </div>

  <script>
    const PAGES = [
      { src: 'images/catalog-1.jpg', label: '제품 라인업' },
      { src: 'images/catalog-2.jpg', label: 'STAY 19RB · 19평 이동식 주택' },
      { src: 'images/catalog-3.jpg', label: 'FOREST-P 10W · CUBE-G 10W' },
      { src: 'images/catalog-4.jpg', label: 'STAY 16GB · 매장 안내' }
    ];

    const pagesEl = document.getElementById('pages');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbClose = document.getElementById('lbClose');

    PAGES.forEach((p, idx) => {
      const card = document.createElement('div');
      card.className = 'page';

      const img = document.createElement('img');
      img.src = p.src;
      img.alt = `${idx + 1}. ${p.label}`;
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(p.src, img.alt));
      img.addEventListener('error', () => {
        const fb = document.createElement('div');
        fb.className = 'img-fallback';
        fb.innerHTML = `<strong>${idx + 1}. ${p.label}</strong>이미지가 아직 등록되지 않았습니다.<br />(<code>${p.src}</code>)`;
        img.replaceWith(fb);
      });

      const label = document.createElement('div');
      label.className = 'page-label';
      label.textContent = `${idx + 1}. ${p.label}`;

      card.appendChild(img);
      card.appendChild(label);
      pagesEl.appendChild(card);
    });

    function openLightbox(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt || '';
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('open');
      lbImg.src = '';
      document.body.style.overflow = '';
    }
    lbClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  </script>
</body>
</html>
