<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세움 박람회 특별혜택 신청</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background: #ffffff;
      padding: 28px 20px 40px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .sub {
      margin: 0 0 24px;
      font-size: 15px;
      color: #555;
      line-height: 1.5;
    }

    .benefit-box {
      background: #fff7e6;
      border: 1px solid #ffd28a;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }

    .benefit-box strong {
      color: #c25a00;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .field {
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px 14px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #111;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .option-card {
      position: relative;
    }

    .option-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .option-card span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      background: #fff;
    }

    .option-card input:checked + span {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    .agree {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 24px 0;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .agree input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: #c40000;
      color: #fff;
      padding: 17px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .notice {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #eefaf1;
      border: 1px solid #b7e4c7;
      color: #166534;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">SEUM 박람회 한정</div>

    <h1>박람회 특별혜택<br />상담 신청</h1>
    <p class="sub">
      간단히 신청하시면 담당자가 빠르게 상담을 도와드립니다.
    </p>

    <div class="benefit-box">
      🎁 <strong>상담 고객 전원 혜택</strong><br />
      박람회 현장 상담 시 사은품 및 계약 특별혜택을 안내드립니다.
    </div>

    <form id="fairForm">
      <div class="field">
        <label for="name">성함</label>
        <input id="name" name="name" type="text" placeholder="홍길동" required />
      </div>

      <div class="field">
        <label for="phone">연락처</label>
        <input id="phone" name="phone" type="tel" placeholder="010-0000-0000" required />
      </div>

      <div class="field">
        <label>관심 상품</label>
        <div class="option-grid">
          <label class="option-card">
            <input type="radio" name="product" value="STAY 19RB(이동식 주택)" required />
            <span>STAY 19RB(이동식 주택)</span>
          </label>
          <label class="option-card">
            <input type="radio" name="product" value="STAY 16GB(이동식 주택)" />
            <span>STAY 16GB(이동식 주택)</span>
          </label>
          <label class="option-card">
            <input type="radio" name="product" value="CUBE-G 10W(스크린 골프)" />
            <span>CUBE-G 10W(스크린 골프)</span>
          </label>
          <label class="option-card">
            <input type="radio" name="product" value="FOREST-P 10W(체류형쉼터)" />
            <span>FOREST-P 10W(체류형쉼터)</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>건축 예정 시기</label>
        <div class="option-grid">
          <label class="option-card">
            <input type="radio" name="period" value="1개월 이내" required />
            <span>1개월 이내</span>
          </label>
          <label class="option-card">
            <input type="radio" name="period" value="3개월 이내" />
            <span>3개월 이내</span>
          </label>
          <label class="option-card">
            <input type="radio" name="period" value="6개월 이내" />
            <span>6개월 이내</span>
          </label>
          <label class="option-card">
            <input type="radio" name="period" value="미정" />
            <span>미정</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>토지 보유 여부</label>
        <div class="option-grid">
          <label class="option-card">
            <input type="radio" name="land" value="있음" required />
            <span>있음</span>
          </label>
          <label class="option-card">
            <input type="radio" name="land" value="없음" />
            <span>없음</span>
          </label>
          <label class="option-card">
            <input type="radio" name="land" value="매입 예정" />
            <span>매입 예정</span>
          </label>
          <label class="option-card">
            <input type="radio" name="land" value="상담 필요" />
            <span>상담 필요</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="memo">기타 문의사항 <small style="font-weight:400;color:#777;">선택</small></label>
        <textarea id="memo" name="memo" rows="3" placeholder="궁금하신 내용을 적어주세요."></textarea>
      </div>

      <label class="agree">
        <input type="checkbox" name="agree" required />
        <span>개인정보 수집 및 상담 연락에 동의합니다. 입력하신 정보는 상담 안내 목적으로만 사용됩니다.</span>
      </label>

      <button type="submit">혜택 신청하기</button>
    </form>

    <div id="successBox" class="success">
      신청이 완료되었습니다.<br />현장 담당자가 곧 상담을 도와드리겠습니다.
    </div>

    <p class="notice">
      ※ 정확한 상담을 위해 연락처를 정확히 입력해주세요.
    </p>
  </main>

  <script>
    const form = document.getElementById('fairForm');
    const successBox = document.getElementById('successBox');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = new FormData(form);

      const data = {
        created_at: new Date().toISOString(),
        name: formData.get('name'),
        phone: formData.get('phone'),
        product: formData.get('product'),
        period: formData.get('period'),
        land: formData.get('land'),
        memo: formData.get('memo'),
        source: '박람회 QR',
        status: '신규접수',
        grade: getGrade(formData.get('period'), formData.get('land'))
      };

      console.log('박람회 고객 DB:', data);

      // TODO: 여기에 Supabase, n8n Webhook, Google Sheet API 연결 가능
      // 예시:
      // await fetch('여기에_n8n_webhook_url', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify(data)
      // });

      form.style.display = 'none';
      successBox.style.display = 'block';
    });

    function getGrade(period, land) {
      if ((period === '1개월 이내' || period === '3개월 이내') && land === '있음') {
        return 'A급';
      }
      if (land === '있음' || period === '6개월 이내') {
        return 'B급';
      }
      return 'C급';
    }
  </script>
</body>
</html>
